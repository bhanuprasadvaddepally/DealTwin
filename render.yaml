services:
  - type: web
    name: dealtwin-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:///./data/dealtwin.db
      - key: HINDSIGHT_BASE_URL
        value: https://api.hindsight.vectorize.io
      - key: HINDSIGHT_API_KEY
        sync: false
      - key: HINDSIGHT_BANK_ID
        value: dealtwin-demo
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: dealtwin-frontend
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: dealtwin-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: dealtwin-api
          envVarKey: RENDER_EXTERNAL_URL